services:
  postgres:
    image: postgres:16-alpine
    container_name: bridge-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bridge
    volumes:
      - bridge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bridge']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bridge-postgres-data:
